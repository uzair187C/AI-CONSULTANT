  <style>
    :root {
      --bg-primary: #080A0E;
      --bg-surface: #0F1318;
      --bg-elevated: #161B23;
      --bg-card: #111620;
      --border: #1E2530;
      --border-bright: #2A3444;
      --text-primary: #EDF2F7;
      --text-secondary: #7A8899;
      --text-muted: #3D4A5C;
      --accent-green: #10D97C;
      --accent-green-dim: #064B2A;
      --accent-amber: #F5A623;
      --accent-amber-dim: #4A320A;
      --accent-red: #F0564A;
      --accent-red-dim: #4A1410;
      --accent-blue: #4F8EF7;
      --accent-blue-dim: #172B5E;
      --accent-blue-bright: #2563EB;
      --glow-blue: rgba(79,142,247,0.15);
      --glow-green: rgba(16,217,124,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(37,99,235,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(16,217,124,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    #root { position: relative; z-index: 1; }
    /* Typography */
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .label-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    /* Nav */
    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(8,10,14,0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    /* Cards */
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .glass-card:hover {
      border-color: var(--border-bright);
      transform: translateY(-3px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(79,142,247,0.05);
    }
    /* Tier borders */
    .tier-strong  { border-left: 4px solid var(--accent-green) !important; }
    .tier-borderline { border-left: 4px solid var(--accent-amber) !important; }
    .tier-not_eligible { border-left: 4px solid var(--accent-red) !important; }
    /* Tier glow backgrounds */
    .tier-strong-bg  { background: linear-gradient(135deg, rgba(16,217,124,0.04) 0%, transparent 50%); }
    .tier-borderline-bg { background: linear-gradient(135deg, rgba(245,166,35,0.04) 0%, transparent 50%); }
    .tier-not_eligible-bg { background: linear-gradient(135deg, rgba(240,86,74,0.04) 0%, transparent 50%); }
    /* Pills / Toggle buttons */
    .pill {
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
      border: 1px solid transparent;
      white-space: nowrap;
      user-select: none;
    }
    .pill-active {
      background: var(--accent-blue-bright);
      color: #fff;
      border-color: rgba(79,142,247,0.3);
      box-shadow: 0 0 16px rgba(37,99,235,0.35);
    }
    .pill-inactive {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border-color: var(--border);
    }
    .pill-inactive:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-bright);
    }
    /* Inputs */
    .field-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      transition: all 0.2s;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    .field-input:focus {
      border-color: var(--accent-blue);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
    }
    .field-input::placeholder { color: var(--text-muted); }
    .field-input.error { border-color: var(--accent-red); box-shadow: 0 0 0 3px rgba(240,86,74,0.12); }
    select.field-input {

      background-repeat: no-repeat;
      background-position: right 0.85rem center;
      background-size: 16px;
      padding-right: 2.5rem;
    }
    /* Primary button */
    .btn-primary {
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.85rem 2rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 4px 20px rgba(37,99,235,0.3);
      width: 100%;
      letter-spacing: 0.01em;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(37,99,235,0.4);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-card); border-color: var(--border-bright); }
    /* Loader */
    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(79,142,247,0.2); }
      50% { box-shadow: 0 0 40px rgba(79,142,247,0.5); }
    }
    .animate-fade-up { animation: fade-up 0.5s ease both; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .spin-ring {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin-ring 0.9s linear infinite;

    /* Step indicator */
    .step-line {
      height: 2px;
      width: 48px;
      background: linear-gradient(90deg, var(--accent-blue) 0%, var(--border) 100%);
    }
    /* Check / Cross icons */
    .req-pass { color: var(--accent-green); }
    .req-fail { color: var(--accent-red); }
    /* Tier badge */
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;

    .badge-strong  { background: var(--accent-green-dim); color: var(--accent-green); }
    .badge-borderline { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .badge-not_eligible { background: var(--accent-red-dim); color: var(--accent-red); }
    /* Checklist item */
    .checklist-item {
      display: flex; gap: 0.6rem; align-items: flex-start;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-secondary);
    }
    .checklist-item:last-child { border-bottom: none; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
    /* Hero gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #EDF2F7 0%, #93C5FD 50%, #60A5FA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    /* Stat pills */
    .stat-chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.3rem 0.85rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    /* Form progress */
    .progress-bar {
      height: 2px;
      background: linear-gradient(90deg, var(--accent-blue) 0%, rgba(79,142,247,0.2) 100%);
      transition: width 0.4s ease;
      border-radius: 1px;
    }

    function convertGPA(format, value) {
      const v = parseFloat(value);
      if (isNaN(v)) return null;
      if (format === 'percentage') return 1 + 3 * (100 - v) / 50;
      if (format === '4.0') return 1 + 3 * (4.0 - v) / 3.0;
      return v;
    }

    function meetsGermanRequirement(userLevel, required) {
      if (!required || required === 'None') return true;
      const order = ['None', 'A1', 'A2', 'B1', 'B2', 'C1', 'C2', 'DSH-1', 'DSH-2', 'TestDaF-4x4'];
      const normalize = (l) => {
        if (l === 'DSH-2' || l === 'TestDaF-4x4') return 8;
        if (l === 'DSH-1') return 7;
        return order.indexOf(l);
      };
      return normalize(userLevel || 'None') >= normalize(required);
    }

    function matchUniversity(profile, program) {
      const issues = [];
      const passes = [];

      if (profile.german_grade > program.min_german_grade) {
        issues.push({ field: 'GPA', detail: `Minimum ${program.min_german_grade} required, you have ${profile.german_grade.toFixed(2)}` });
      } else {
        passes.push({ field: 'GPA', detail: `Meets minimum GPA requirement (${profile.german_grade.toFixed(2)} / required ≤ ${program.min_german_grade})` });
      }

      if (program.language === 'English' || program.language === 'Bilingual') {
        if (profile.ielts === null) {
          issues.push({ field: 'IELTS', detail: 'English test score required for this program' });
        } else if (profile.ielts < program.english_requirement.ielts_min) {
          issues.push({ field: 'IELTS', detail: `Minimum ${program.english_requirement.ielts_min} required, you have ${profile.ielts}` });
        } else {
          passes.push({ field: 'IELTS', detail: `IELTS ${profile.ielts} meets requirement (min ${program.english_requirement.ielts_min})` });
        }
      }

      if (program.language === 'German' || program.language === 'Bilingual') {
        const required = program.german_requirement.min_level;
        if (!meetsGermanRequirement(profile.german_level, required)) {
          issues.push({ field: 'German', detail: `${required} required, you have ${profile.german_level || 'None'}` });
        } else {
          passes.push({ field: 'German', detail: 'German language level meets requirement' });
        }
      }

      const apsRequired = program.aps_required_nationalities.includes(profile.nationality);
      if (apsRequired && !profile.aps_certified) {
        issues.push({ field: 'APS Certificate', detail: 'APS Certificate required for your nationality. 6–8 weeks processing time.' });
      } else if (apsRequired) {
        passes.push({ field: 'APS Certificate', detail: 'APS certified ✓' });
      }

      if (program.degree === 'MS' && !profile.has_bachelor) {
        issues.push({ field: 'Bachelor Degree', detail: "MS programs require a completed bachelor's degree" });
      } else if (program.degree === 'MS') {
        passes.push({ field: 'Bachelor Degree', detail: "Bachelor's degree requirement met" });
      }

      if (profile.preferred_intake !== 'Both' && !program.intake.includes(profile.preferred_intake)) {
        issues.push({ field: 'Intake', detail: `This program only offers ${program.intake.join('/')} intake` });
      } else if (profile.preferred_intake !== 'Both') {
        passes.push({ field: 'Intake', detail: `${profile.preferred_intake} intake available` });
      }

      let tier;
      if (issues.length === 0) tier = 'strong';
      else if (issues.length <= 2) tier = 'borderline';
      else tier = 'not_eligible';

      return { tier, issues, passes };
    }

    function filterAndMatch(profile, prefs) {
      const results = [];
      UNIVERSITY_DATA.forEach(uni => {
        uni.programs.forEach(program => {
          if (program.degree !== profile.degree_target) return;
          if (!program.field_tags.some(t => profile.fields.includes(t))) return;
          if (prefs.language_pref === 'English' && program.language === 'German') return;
          if (prefs.language_pref === 'German' && program.language === 'English') return;

          const match = matchUniversity(profile, program);
          results.push({ uni, program, ...match });
        });
      });

      const tierOrder = { strong: 0, borderline: 1, not_eligible: 2 };
      results.sort((a, b) => {
        const cityA = prefs.cities.includes('No Preference') || prefs.cities.includes(a.uni.city) ? 0 : 1;
        const cityB = prefs.cities.includes('No Preference') || prefs.cities.includes(b.uni.city) ? 0 : 1;
        if (cityA !== cityB) return cityA - cityB;
        return tierOrder[a.tier] - tierOrder[b.tier];
      });
      return results;
    }

    function buildMatchSummary(results) {
      const strong = results.filter(r => r.tier === 'strong').length;
      const borderline = results.filter(r => r.tier === 'borderline').length;
      const notEligible = results.filter(r => r.tier === 'not_eligible').length;
      const gapCounts = {};
      results.forEach(r => r.issues.forEach(i => { gapCounts[i.field] = (gapCounts[i.field] || 0) + 1; }));
      const topMissing = Object.entries(gapCounts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([f]) => f);
      const topStrength = results.some(r => r.passes.some(p => p.field === 'GPA'))
        ? 'GPA meets most university thresholds' : 'Profile partially matches some programs';
      return { strong_match_count: strong, borderline_count: borderline, not_eligible_count: notEligible, top_missing_requirements: topMissing, top_strength: topStrength };
    }

    async function callGroq(profile, matchSummary) {
      const payload = {
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1000,
        messages: [
          {
            role: 'system',
            content: `You are a Germany university admissions consultant. You receive a structured JSON of a student's profile and a pre-computed match analysis. Your job is to write a 2–3 sentence honest consultation summary — what is their strongest asset, their biggest blocker, and one specific actionable recommendation. Be direct. Do not use filler phrases. Do not say "It seems like" or "Based on the information provided".`
          },
          {
            role: 'user',
            content: JSON.stringify({ profile, match_summary: matchSummary })
          }
        ]
      };
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${GROQ_API_KEY}` },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Groq API failed');
      const data = await res.json();
      return data.choices[0].message.content;
    }

              </div>
            </div>
            <button onClick={onStartOver} className="btn-secondary text-sm px-4 py-2">
              ⟲ Start Over
            </button>
          </div>

          {showAPS && <APSBanner />}
          {isBS && <BSWarningBanner />}
          <ConsultationSummary text={summary} unavailable={summaryUnavailable} />

          <div className="flex flex-col lg:flex-row gap-6">
            <div className="hidden lg:block lg:w-[280px] flex-shrink-0">
              <UniversalChecklist showAPS={showAPS} isBS={isBS} />
            </div>

            <div className="flex-1">
              {results.length === 0 ? (
                <p className="text-[#8A9099]">No matching programs found for your criteria. Try adjusting your field or language preferences.</p>
              ) : (
                results.map((r, i) => (
                  <UniversityCard key={`${r.uni.id}-${r.program.name}-${i}`} result={r} preferredIntake={prefs.preferred_intake} />
                ))
              )}
            </div>
          </div>

          <div className="lg:hidden mt-6">
            <button onClick={() => setChecklistOpen(!checklistOpen)}
              className="w-full bg-[#161A20] border border-[#2A2F38] rounded-lg p-4 text-left font-mono text-xs uppercase tracking-widest text-[#8A9099]">
              {checklistOpen ? '▼' : '▶'} What you need to apply to Germany
            </button>
            {checklistOpen && <div className="mt-2"><UniversalChecklist showAPS={showAPS} isBS={isBS} /></div>}
          </div>
        </div>
      );
    }

    function AppWrapper() {
      const [screen, setScreen] = useState('landing');
      const [step, setStep] = useState(1);
      const [profile, setProfile] = useState({ ...INITIAL_PROFILE });
      const [prefs, setPrefs] = useState({ ...INITIAL_PREFS });
      const [loaderMsg, setLoaderMsg] = useState('Checking 12 universities...');
      const [results, setResults] = useState([]);
      const [summary, setSummary] = useState('');
      const [summaryUnavailable, setSummaryUnavailable] = useState(false);

      const runAnalysis = async () => {
        setScreen('loading');
        const msgs = ['Checking 12 universities...', 'Running gap analysis...', 'Writing your consultation...'];
        let mi = 0;
        const interval = setInterval(() => { mi = (mi + 1) % msgs.length; setLoaderMsg(msgs[mi]); }, 1200);

        const germanGrade = convertGPA(profile.gpa_format, profile.gpa_value);
        const fullProfile = {
          nationality: profile.nationality,
          degree_target: profile.degree_target,
          field: profile.fields.join(', '),
          fields: profile.fields,
          gpa_german_equivalent: germanGrade,
          german_grade: germanGrade,
          ielts: profile.ielts_not_taken ? null : parseFloat(profile.ielts),
          german_level: profile.german_level,
          aps_certified: profile.aps_na ? true : profile.aps_certified,
          has_bachelor: profile.has_bachelor,
          preferred_intake: prefs.preferred_intake
        };

        const matchResults = filterAndMatch(fullProfile, prefs);
        const matchSummary = buildMatchSummary(matchResults);

        let aiSummary = '';
        let unavailable = false;
        try {
          aiSummary = await callGroq({
            nationality: fullProfile.nationality,
            degree_target: fullProfile.degree_target,
            field: fullProfile.field,
            gpa_german_equivalent: fullProfile.gpa_german_equivalent,
            ielts: fullProfile.ielts,
            german_level: fullProfile.german_level,
            aps_certified: profile.aps_certified
          }, matchSummary);
        } catch {
          unavailable = true;
        }

        clearInterval(interval);
        setResults(matchResults);
        setSummary(aiSummary);
        setSummaryUnavailable(unavailable);
        setScreen('results');
      };

      const startOver = () => {
        setProfile({ ...INITIAL_PROFILE });
        setPrefs({ ...INITIAL_PREFS });
        setStep(1);
        setScreen('landing');
        setResults([]);
        setSummary('');
        setSummaryUnavailable(false);
      };

      return (
        <div className="min-h-screen">
          {screen === 'landing' && (
            <div className="max-w-[1100px] mx-auto px-4 py-16 animate-fade-up">
              <div className="text-center mb-16 max-w-2xl mx-auto">
                <div className="inline-block mb-6 relative">
                  <div className="absolute inset-0 bg-blue-500 blur-xl opacity-20 rounded-full animate-pulse-glow"></div>
                  <div className="relative bg-blue-500/10 border border-blue-500/20 text-blue-400 font-mono text-xs uppercase tracking-widest px-4 py-1.5 rounded-full">AdmitDE Intelligence</div>
                </div>
                <h1 className="text-5xl md:text-6xl font-extrabold tracking-tight mb-6 leading-[1.15]">
                  <span className="text-white">Tell us your grades.</span><br />
                  <span className="gradient-text">We'll tell you where you stand in Germany.</span>
                </h1>
                <p className="text-[#8A9099] text-lg md:text-xl leading-relaxed mb-10 max-w-xl mx-auto">
                  AI-powered admission consultant for CS, AI & Data Science at German public universities. Get a realistic gap analysis in seconds.
                </p>
                <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                  <button onClick={() => setScreen('form')}
                    className="btn-primary flex items-center justify-center gap-2 group w-full sm:w-auto">
                    Check My Eligibility
                    <span className="group-hover:translate-x-1 transition-transform">→</span>
                  </button>
                  <div className="stat-chip">
                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span>12 Universities Covered</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {screen === 'form' && step === 1 && (
            <div className="max-w-[1100px] mx-auto px-4 py-12">
              <ProfileForm profile={profile} setProfile={setProfile} onNext={() => setStep(2)} />
            </div>
          )}

          {screen === 'form' && step === 2 && (
            <div className="max-w-[1100px] mx-auto px-4 py-12">
              <PreferencesForm prefs={prefs} setPrefs={setPrefs} onBack={() => setStep(1)} onSubmit={runAnalysis} />
            </div>
          )}

          {screen === 'loading' && <AnalysisLoader message={loaderMsg} />}

          {screen === 'results' && (
            <ResultsView
              profile={{ ...profile, aps_certified: profile.aps_na ? true : profile.aps_certified }}
              prefs={prefs}
              results={results}
              summary={summary}
              summaryUnavailable={summaryUnavailable}
              onStartOver={startOver}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper />);
  </script>
</body>
</html>
